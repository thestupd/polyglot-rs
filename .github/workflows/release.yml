name: Release bundle
on:
  push:
    branches: ['release/**']
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, platform: darwin-arm64 }
          - { os: macos-15-intel, platform: darwin-x64 }
          - { os: ubuntu-24.04, platform: linux-x64-gnu }
          - { os: ubuntu-24.04-arm, platform: linux-arm64-gnu }
          - { os: windows-2022, platform: win32-x64-msvc }
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: npm ci --ignore-scripts --registry=https://registry.npmjs.org/
      - run: npm run build
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:package
      - name: Independent full decoding
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npm run test:parsers
        env:
          REQUIRE_EXTERNAL_PARSERS: '1'
      - run: npm run release:record -- ${{ matrix.platform }}
      - uses: actions/upload-artifact@v7
        with:
          name: release-native-${{ matrix.platform }}
          path: packages/node/native/
          if-no-files-found: error

  assemble:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --registry=https://registry.npmjs.org/
      - uses: actions/download-artifact@v8
        with:
          pattern: release-native-*
          path: artifacts
      - run: npm run build:ts --workspace=polyglot-rs
      - run: npm run release:prepare -- artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: npm-release
          path: |
            release/*.tgz
            release/release.json
          if-no-files-found: error

  verify-install:
    needs: assemble
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, ubuntu-24.04, ubuntu-24.04-arm, windows-2022]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v8
        with:
          name: npm-release
          path: release
      - name: Install the exact release without a native build
        shell: bash
        run: npm run test:release -- release/polyglot-rs-$(node -p 'require("./packages/node/package.json").version').tgz
