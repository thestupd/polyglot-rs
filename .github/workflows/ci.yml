name: CI
on:
  push:
    branches-ignore: ['release/**']
  pull_request:
permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2022]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: Install independent decoder
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Decode fixtures with independent parsers
        if: runner.os == 'Linux'
        run: npm run test:parsers
        env:
          REQUIRE_EXTERNAL_PARSERS: '1'
      - run: npm run test:package
      - uses: actions/upload-artifact@v7
        if: matrix.node == 24
        with:
          name: native-${{ matrix.os }}
          path: packages/node/native/*.node
