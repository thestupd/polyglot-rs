[workspace]
members = ["crates/polyglot-core", "crates/polyglot-formats", "crates/polyglot-strategies", "crates/polyglot-napi"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
authors = ["Thieu Quan Ngoc <hi@stupd.dev>"]
repository = "https://github.com/thestupd/polyglot-rs"
homepage = "https://github.com/thestupd/polyglot-rs#readme"

[workspace.dependencies]
polyglot-core = { path = "crates/polyglot-core" }
polyglot-formats = { path = "crates/polyglot-formats" }
polyglot-strategies = { path = "crates/polyglot-strategies" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = "symbols"

[workspace.lints.rust]
unsafe_code = "forbid"
